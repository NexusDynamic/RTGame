name: rise_together_game
description: "Rise Together: a cooperative and competitive physics game. Play solo, as a team, or against others."
publish_to: "none"
version: 1.0.1+0

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flame: ^2.0.0-dev.1
  flame_audio: ^2.13.0-dev.1
  flame_forge2d: ^0.21.0-dev.1
  collection: ^1.19.1
  logging: ^1.3.0
  easy_localization: ^3.0.8
  flutter_fullscreen: ^1.2.0
  wakelock_plus: ^1.6.0
  easy_shared_preferences: ^1.1.2
  provider: ^6.1.5+1
  meta: ^1.19.0
  flutter_colorpicker: ^1.1.0
  synchronized: ^3.4.0+1
  package_info_plus: ^10.1.0
  flutter_native_splash: ^2.4.7
  fast_immutable_collections: ^12.0.0
  peer_coordinator: ^0.4.3
  http: ^1.2.2
  web_socket_channel: ^3.0.3
  # The lobby's wire protocol and proof-of-work, shared with the server. Only
  # protocol.dart and pow.dart are imported: both are web-safe.
  rise_together_lobby:
    path: server
  webrtc_coordinator: ^0.2.2
  webrtc_coordinator_flutter: ^0.2.3
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  # Tests call SharedPreferences.setMockInitialValues to initialise settings;
  # it arrives transitively via easy_shared_preferences, but relying on that is
  # how a transitive bump silently breaks the suite.
  shared_preferences: ^2.5.3
  launcher_icons: ^0.16.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/audio/sfx/hi.mp3
    - assets/audio/sfx/lo.mp3
    - assets/audio/music/lobby.mp3
