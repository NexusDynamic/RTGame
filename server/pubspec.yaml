name: rise_together_lobby
description: >-
  Lobby, matchmaking and signaling server for Rise Together. It never runs the
  game: players connect peer to peer and the host's device runs the physics.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.6
  logging: ^1.3.0
  peer_coordinator: ^0.3.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

# Keep dev_dependencies the LAST section: deploy/Dockerfile strips it.
dev_dependencies:
  async: ^2.12.0
  http: ^1.2.2
  webrtc_coordinator: ^0.2.0
  lints: ^6.0.0
  test: ^1.31.2
