# coturn for Rise Together: a relay of last resort for players who cannot
# connect directly. The secret, realm and public IP come from the command
# line (docker-compose.yml), so nothing sensitive lives in this file.

# Ports come from the command line (docker-compose.yml) so a second coturn
# can run next to an existing one.
fingerprint

# Time-limited credentials minted by the lobby (HMAC of the shared secret);
# nothing to store, and a leaked credential expires on its own.
use-auth-secret

# Only relay to the public internet. Without this a TURN server is a way
# into the host's own network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
# IPv4-mapped and NAT64 addresses would reach the IPv4 ranges above by
# another name; 100::/64 is the discard prefix.
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Game traffic is tiny; cap per-session bandwidth and total sessions.
# user-quota is per player (the lobby gives each its own username): a host in
# an 8-player star holds 7 peer connections, each over UDP and TCP.
max-bps=128000
user-quota=16
total-quota=800

stale-nonce=600
# No per-allocation logs: they carry players' IP addresses (see PRIVACY.md).
# simple-log stops coturn appending a date to the file name.
no-stdout-log
simple-log
log-file=/dev/null
