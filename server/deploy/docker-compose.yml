# Rise Together server: Caddy (TLS + web app), the lobby, and coturn.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# The lobby never runs the game. Players connect peer to peer; coturn relays
# encrypted packets only for players who cannot reach each other directly.
services:
  lobby:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      LOBBY_SIGNING_KEY: ${LOBBY_SIGNING_KEY:?set LOBBY_SIGNING_KEY in .env}
      LOBBY_PORT: "8080"
      TRUST_PROXY: "true"
      ALLOWED_ORIGINS: https://${DOMAIN}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-17}
      # Point these at whichever coturn you use (this file's, or one you
      # already run). TURN_SECRET must be that coturn's static-auth-secret.
      STUN_URLS: stun:${TURN_HOST:-${DOMAIN}}:${TURN_PORT:-3478}
      TURN_URLS: turn:${TURN_HOST:-${DOMAIN}}:${TURN_PORT:-3478}?transport=udp,turn:${TURN_HOST:-${DOMAIN}}:${TURN_PORT:-3478}?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      MAX_ROOMS: ${MAX_ROOMS:-200}
    # Not published: only Caddy reaches it.
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [lobby]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # `flutter build web --wasm` output, copied here.
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  # Only started with `--profile turn`. Skip it if the VPS already runs a
  # coturn you can share (see README).
  coturn:
    image: coturn/coturn:4
    profiles: [turn]
    restart: unless-stopped
    # Host networking: TURN relays on a UDP port range, which does not map
    # well through Docker's userland proxy.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in .env}
      # Configurable so it can run next to another coturn: give it a different
      # listening port and a relay range that does not overlap.
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49400}
      # The second instance must not fight the first over these either.
      # (No TLS certificate is configured, so DTLS stays off too.)
      - --no-cli
      - --no-tls

volumes:
  caddy_data:
  caddy_config:
