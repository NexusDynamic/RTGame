variables:
  GITHUB_REPO_PATH: "NexusDynamic/RiseTogether.git"
  GIT_STRATEGY: none

sync_from_github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]

  tags:
    - gitrunner

  script:
    - echo "Starting clean-room sync..."
    - git clone --mirror https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO_PATH} .
    - git push --mirror "https://gitlab-ci:${GITLAB_PUSH_TOKEN}@${CI_PROJECT_URL#https://}"
    - echo "Sync complete."

  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
