name: Build

# Builds every distributed target. Called by release.yml for v* tags; can also
# be run by hand to try the builds without releasing. Each target is uploaded
# as a workflow artifact named rt-<target> (files in dist/). The offline
# GitHub Pages site is uploaded separately, as the run's Pages artifact.
#
# Two web builds:
#   web   - talks to the default lobby (rt-lobby.nexusdynamic.org), served
#           from the root of that host. Attached to the release as a zip.
#   pages - LOBBY_URL=none: offline unless the player sets a server. Served
#           from https://<owner>.github.io/<repo>/.

on:
  workflow_call:
    inputs:
      version:
        description: "Version string used in the artifact file names"
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version string used in the artifact file names"
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: pages
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      NAME: RiseTogether-${{ inputs.version }}
      DEFINES: --dart-define=GIT_SHA=${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # gstreamer and pulse: audioplayers_linux.
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write Android signing config
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build
        # Web builds are self-contained (no CDN), so the COOP/COEP headers on
        # rt-lobby cannot block the renderer.
        run: |
          case "${{ matrix.target }}" in
            android)
              flutter build apk --release $DEFINES
              cp build/app/outputs/flutter-apk/app-release.apk build/universal.apk
              flutter build apk --release --split-per-abi $DEFINES
              ;;
            web)
              flutter build web --release --wasm --no-web-resources-cdn \
                --base-href / $DEFINES
              ;;
            pages)
              flutter build web --release --wasm --no-web-resources-cdn \
                --base-href "/${{ github.event.repository.name }}/" \
                --dart-define=LOBBY_URL=none $DEFINES
              ;;
            *)
              flutter build "${{ matrix.target }}" --release $DEFINES
              ;;
          esac

      - name: Package
        if: matrix.target != 'pages'
        working-directory: build
        run: |
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          case "${{ matrix.target }}" in
            linux)
              tar -C linux/x64/release/bundle -czf "$DIST/$NAME-linux-x64.tar.gz" .
              ;;
            windows)
              (cd windows/x64/runner/Release && 7z a -tzip "$DIST/$NAME-windows-x64.zip" .)
              ;;
            macos)
              # Unsigned: users need to right-click → Open the first time.
              APP="$(find macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
              ditto -c -k --keepParent "$APP" "$DIST/$NAME-macos.zip"
              ;;
            android)
              cp universal.apk "$DIST/$NAME-android-universal.apk"
              for apk in app/outputs/flutter-apk/app-*-release.apk; do
                abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
                cp "$apk" "$DIST/$NAME-android-$abi.apk"
              done
              ;;
            web)
              (cd web && zip -qr "$DIST/$NAME-web.zip" .)
              ;;
          esac
          ls -la "$DIST"

      - name: Upload
        if: matrix.target != 'pages'
        uses: actions/upload-artifact@v4
        with:
          name: rt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload Pages site
        if: matrix.target == 'pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
