name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Lobby server
        working-directory: server
        run: |
          dart pub get
          dart analyze
          dart test

  real-webrtc:
    # Two sessions over real flutter_webrtc on the Linux desktop: the unit
    # tests use a fake adapter, and this is what catches platform differences.
    name: Real WebRTC (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libpulse-dev xvfb
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test/real_webrtc_test.dart -d linux

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        # Self-contained (no CDN) so the COOP/COEP headers in the Caddyfile
        # cannot block the renderer.
        run: >-
          flutter build web --wasm --no-web-resources-cdn
          --dart-define=LOBBY_URL=${{ vars.LOBBY_URL }}
          --dart-define=GIT_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build apk --release
          --dart-define=LOBBY_URL=${{ vars.LOBBY_URL }}
          --dart-define=GIT_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  lobby-image:
    name: Lobby image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f server/deploy/Dockerfile server
