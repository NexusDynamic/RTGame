name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded, or which website you played on.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, iOS, Windows, macOS, Linux, Web]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Solo, Online co-op, Online versus, Level editor, Other]
  - type: markdown
    attributes:
      value: >-
        Found a security problem? Please report it privately instead; see
        SECURITY.md.
